    <script>
      (function() {
        try {
          var heroUrl = '/hero-bg.webp';
          var path = window.location.pathname || '';
          var cached = localStorage.getItem('bec_site_content_cache_v5') || localStorage.getItem('bec_site_content_cache_v4') || localStorage.getItem('bec_site_content_cache_v2');
          if (cached) {
            var data = JSON.parse(cached);
            if (path === '/' || path === '') {
              heroUrl = (data.homepage && data.homepage.hero_bg) || (data.heroes && data.heroes.home_bg) || heroUrl;
            } else if (path.indexOf('/about') === 0) {
              heroUrl = (data.about && data.about.hero_bg) || (data.heroes && data.heroes.subpage_bg) || '/page-hero-bg.webp';
            } else if (path.indexOf('/services') === 0) {
              heroUrl = (data.services_page && data.services_page.hero_bg) || (data.heroes && data.heroes.subpage_bg) || '/page-hero-bg.webp';
            } else if (path.indexOf('/team') === 0) {
              heroUrl = (data.team_page && data.team_page.hero_bg) || (data.heroes && data.heroes.subpage_bg) || '/page-hero-bg.webp';
            } else {
              heroUrl = (data.heroes && data.heroes.subpage_bg) || '/page-hero-bg.webp';
            }
          }
          if (heroUrl) {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'image';
            l.href = heroUrl;
            l.fetchPriority = 'high';
            document.head.appendChild(l);
          }
        } catch (e) {}
      })();
    </script>
